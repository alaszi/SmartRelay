# Production stack (MASTER_PLAN section 3 & 14 Phase 6). Every app image is built from this repo's
# source (see apps/*/Dockerfile); nothing here assumes a registry or CI image-publishing pipeline,
# so `docker compose -f docker-compose.prod.yml up` works standalone on a fresh checkout — it just
# builds locally the first time. deploy/deploy.sh wraps this for the actual VPS deploy.
#
# Secrets and per-deployment config come from a real ".env" file next to this one (never commit
# it — see .env.example for the full reference); DATABASE_URL/REDIS_URL/APP_URL/API_INTERNAL_URL
# are set below instead, since they must point at these services' Docker-internal names, not the
# values a local dev .env uses.
name: smartrelay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartrelay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: smartrelay
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartrelay -d smartrelay']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction so queued jobs are never dropped under memory pressure.
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://smartrelay:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/smartrelay
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # 127.0.0.1, not localhost: Alpine resolves "localhost" to ::1 first, and Fastify binds only
      # the IPv4 0.0.0.0 (apps/api/src/main.ts), so an IPv6-first resolution gets connection-refused.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://smartrelay:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/smartrelay
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # One-shot: `docker compose -f docker-compose.prod.yml run --rm migrate` (deploy.sh's job).
  # Reuses the api image's `build` stage, which still has the full workspace + tsx, rather than the
  # pruned runtime image, which deliberately doesn't.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgres://smartrelay:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/smartrelay
    working_dir: /repo
    # db:seed is idempotent (onConflictDoNothing) — chaining it here means a fresh deploy always has
    # pricing configured; without it, ingest 500s on every relay until someone remembers to seed by hand.
    entrypoint:
      [
        'sh',
        '-c',
        'pnpm --filter @smartrelay/db db:migrate && pnpm --filter @smartrelay/db db:seed',
      ]
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ['tools']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:3001
      APP_URL: ${APP_URL:?APP_URL is required}
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.smartrelay.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
