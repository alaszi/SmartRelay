# MASTER_PLAN section 3: / -> web, /api/* and /i/* -> api, /inbound/* -> api. Same-origin in
# production so cookies and the CSRF Origin check (apps/api/src/csrf.ts) work without any
# cross-origin exception. Also routes /tg/* (Telegram callbacks) and the health endpoints to api,
# which section 3's short summary doesn't spell out but section 9's API surface lists on api too.
#
# Runs as the `nginx` service in docker-compose.prod.yml, so `api`/`web` below resolve via Docker's
# internal DNS — this file is not meant to be used outside that compose stack as-is.

upstream smartrelay_web {
  server web:3000;
}

upstream smartrelay_api {
  server api:3001;
}

server {
  listen 80;
  server_name _;

  # Real client IP through to Fastify's trustProxy (apps/api reads this when TRUST_CLOUDFLARE is
  # set; the app itself still validates the CF-Connecting-IP header is only trusted from
  # Cloudflare's ranges — this proxy_set_header alone does not grant that trust).
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;

  location ~ ^/(api|i|inbound|tg|healthz|readyz)(/|$) {
    proxy_pass http://smartrelay_api;
  }

  location / {
    proxy_pass http://smartrelay_web;
  }
}
