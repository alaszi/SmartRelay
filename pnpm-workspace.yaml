packages:
  - apps/*
  - packages/*

# No dependency may run install scripts (MASTER_PLAN section 8.8). esbuild ships prebuilt
# binaries through optional dependencies and does not need its postinstall step.
allowBuilds:
  esbuild: false
  # msgpackr's native accelerator; msgpackr has a pure-JS fallback so the build is unnecessary.
  msgpackr-extract: false
