name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Integration tests create and use their own smartrelay_test database on this server.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartrelay
          POSTGRES_PASSWORD: smartrelay
          POSTGRES_DB: smartrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartrelay -d smartrelay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # BullMQ-backed tests (deliver queue, loop guard, release-held) need a real Redis. Without
      # this, ioredis's maxRetriesPerRequest: null (apps/api and apps/worker test helpers) retries
      # the connection forever instead of failing fast, hanging the Test step until the job's
      # 15-minute timeout kills it — found by checking actual CI run history, not assumed working.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm (version pinned by packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit dependencies (warn only)
        run: pnpm audit --audit-level=high
        continue-on-error: true
