name: Deploy (manual)

# Manual-only until the owner picks a production host (MASTER_PLAN D8). Pushing to main must
# never deploy. Phase 6 replaces the placeholder step with the SSH deploy (deploy/deploy.sh).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: No deployment target configured
        run: |
          echo "::error::No production host has been chosen yet. Nothing was deployed."
          exit 1
